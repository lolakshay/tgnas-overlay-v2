<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Screenshot Portal</title>
  <meta name="description" content="Secure, mobile-responsive dashboard for viewing and managing transparent overlay captures.">
  
  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  
  <!-- Ambient background glow blobs -->
  <div class="bg-glow blob-1"></div>
  <div class="bg-glow blob-2"></div>

  <!-- Main Container -->
  <main id="app-container">
    
    <!-- 1. LOGIN SCREEN -->
    <section id="login-screen" class="screen active">
      <div class="glass-card login-card">
        <div class="login-header">
          <div class="logo-icon">
            <svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/>
              <path d="M12 6v12M6 12h12"/>
            </svg>
          </div>
          <h1>Capture Portal</h1>
          <p>Access your secure desktop captures</p>
        </div>
        
        <form id="login-form">
          <div class="input-group">
            <label for="password-input">Security Password</label>
            <div class="password-wrapper">
              <input type="password" id="password-input" placeholder="••••••••••••" required autocomplete="current-password">
              <button type="button" id="toggle-password-visibility" class="icon-button" aria-label="Toggle password visibility">
                <svg id="eye-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>
          
          <div id="login-error" class="error-banner hidden" role="alert"></div>
          
          <button type="submit" id="login-submit-btn" class="btn primary-btn">
            <span>Unlock Dashboard</span>
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </button>
        </form>
      </div>
    </section>

    <!-- 2. DASHBOARD SCREEN -->
    <section id="dashboard-screen" class="screen">
      <!-- Navbar -->
      <header class="navbar glass-card">
        <div class="navbar-brand">
          <div class="logo-icon small">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/>
            </svg>
          </div>
          <h1>Overlay Capture</h1>
        </div>
        <div class="navbar-actions">
          <span id="badge-count" class="status-indicator">0 Screenshots</span>
          <button id="logout-btn" class="btn secondary-btn" aria-label="Logout">
            <span>Lock</span>
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/>
            </svg>
          </button>
        </div>
      </header>

      <!-- Main Dashboard Grid -->
      <div class="dashboard-grid">
        
        <!-- Latest Screenshot Box -->
        <article class="latest-section glass-card">
          <div class="section-header">
            <h2>Latest Desktop Capture</h2>
            <div class="latest-badge">Live View</div>
          </div>
          
          <div id="latest-image-container" class="image-wrapper empty">
            <div class="placeholder-text">Waiting for screenshots...</div>
          </div>
          
          <div id="latest-details" class="capture-info hidden">
            <div class="info-group">
              <div class="timestamp-box">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="12" cy="12" r="10"></circle>
                  <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
                <span id="latest-time">-</span>
              </div>
              <div class="size-box">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"></path>
                </svg>
                <span id="latest-size">-</span>
              </div>
            </div>
            <div class="action-row">
              <button id="btn-view-latest" class="btn primary-btn small">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
                View Full
              </button>
              <button id="btn-copy-latest" class="btn secondary-btn small">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                  <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"></path>
                </svg>
                <span>Copy Image</span>
              </button>
              <button id="btn-chatgpt-latest" class="btn secondary-btn small">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m0-12.728l.707.707m11.314 11.314l.707.707M12 8a4 4 0 100 8 4 4 0 000-8z"/>
                </svg>
                ChatGPT
              </button>
              <button id="btn-delete-latest" class="btn danger-btn icon-only-mobile" aria-label="Delete screenshot">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                  <polyline points="3 6 5 6 21 6"></polyline>
                  <path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"></path>
                  <line x1="10" y1="11" x2="10" y2="17"></line>
                  <line x1="14" y1="11" x2="14" y2="17"></line>
                </svg>
                <span>Delete</span>
              </button>
            </div>
          </div>
        </article>

        <!-- History Section -->
        <section class="history-section glass-card">
          <div class="section-header">
            <h2>Capture History</h2>
            <button id="btn-refresh-history" class="btn text-btn" aria-label="Refresh grid">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 11-.57-8.38l5.67-5.67"/>
              </svg>
              <span>Refresh</span>
            </button>
          </div>
          
          <div id="history-grid" class="history-grid">
            <!-- Dynamically populated card elements -->
          </div>
          
          <div id="history-empty-state" class="empty-state">
            <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
              <circle cx="8.5" cy="8.5" r="1.5"/>
              <polyline points="21 15 16 10 5 21"/>
            </svg>
            <p>No captures in history yet</p>
          </div>
        </section>
      </div>
    </section>

  </main>

  <!-- 3. FULLSCREEN LIGHTBOX -->
  <dialog id="lightbox-viewer" class="lightbox-modal">
    <div class="lightbox-overlay">
      <button id="lightbox-close" class="lightbox-close-btn" aria-label="Close viewer">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
      <div class="lightbox-content">
        <img id="lightbox-image" src="" alt="Fullscreen Capture View">
      </div>
      <div class="lightbox-footer">
        <div id="lightbox-caption" class="lightbox-caption-text">-</div>
        <button id="lightbox-copy-btn" class="btn secondary-btn small">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"></path>
          </svg>
          <span>Copy Image</span>
        </button>
        <button id="lightbox-chatgpt-btn" class="btn primary-btn small">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m0-12.728l.707.707m11.314 11.314l.707.707M12 8a4 4 0 100 8 4 4 0 000-8z"/>
          </svg>
          Ask ChatGPT
        </button>
      </div>
    </div>
  </dialog>

  <!-- Script -->
  <script src="app.js"></script>
</body>
</html>
